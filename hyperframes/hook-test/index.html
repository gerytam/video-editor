<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"hook","type":"string","label":"Hook text","default":"Your patio isn&#39;t sinking. It was built on sand."},
    {"id":"keyword","type":"string","label":"Comment keyword","default":"DRAINAGE"},
    {"id":"brand","type":"color","label":"Brand color","default":"#FFE800"},
    {"id":"onbrand","type":"color","label":"Text on brand color","default":"#000000"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      body { font-family: "Inter", sans-serif; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="11.9"
      data-width="1080"
      data-height="1920"
    >
      <video
        id="a-roll"
        class="clip"
        src="assets/sample-video.mp4"
        playsinline
        data-has-audio="true"
        data-start="0"
        data-duration="11.9"
        data-track-index="0"
        style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"
      ></video>

      <div
        id="hook"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="3.6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 2"
      ></div>

      <div
        id="cta"
        data-composition-id="cta"
        data-composition-src="compositions/cta.html"
        data-start="8.4"
        data-duration="3.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 2"
      ></div>
    </div>

    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
